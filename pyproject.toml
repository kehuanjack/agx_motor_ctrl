[build-system]
requires = ["setuptools>=40.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agx_motor_ctrl"
dynamic = ["version"]
description = "Python SDK for Agilex motor drivers over CAN"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Agilex Robotics Co., Ltd." }]
license = { file = "LICENSE" }
requires-python = ">=3.6"
dependencies = ["python-can>=3.3.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
]

[project.urls]
Homepage = "https://github.com/kehuanjack/agx_motor_ctrl"

[tool.setuptools.packages.find]
where = ["."]
include = ["agx_motor_ctrl", "agx_motor_ctrl.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
"agx_motor_ctrl" = ["py.typed", "motor/*.so", "motor/*.dll", "motor/*.dylib"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "agx_motor_ctrl.version.__version__" }

[project.optional-dependencies]
dev = ["pytest>=6.2.5,<8"]
